<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Goosey Smash World Ultimate</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #08111f;
            color: white;
            font-family: system-ui, sans-serif;
        }

        /* ==================================================
           🌌 FULL PAGE
           ================================================== */

        #smashPage {
            position: relative;

            width: 100vw;
            height: 100vh;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            background: #08111f;
        }

        /* ==================================================
           ✨ ANIMATED BACKGROUND
           ================================================== */

        #ambientCanvas {
            position: absolute;

            inset: -8%;

            width: 116%;
            height: 116%;

            z-index: 0;

            opacity: 0.65;

            filter:
                blur(28px)
                saturate(1.35);

            transform: scale(1.08);

            pointer-events: none;
        }

        /* Darkens the ambient copy so the game stays readable */
        #ambientShade {
            position: absolute;

            inset: 0;

            z-index: 1;

            background:
                radial-gradient(
                    circle at center,
                    rgba(8, 17, 31, 0.15),
                    rgba(8, 17, 31, 0.72)
                );

            pointer-events: none;
        }

        /* ==================================================
           🪿 TITLE
           ================================================== */

        #topBar {
            position: relative;

            z-index: 5;

            width: 100%;

            padding:
                12px
                20px
                8px;

            text-align: center;

            background:
                linear-gradient(
                    to bottom,
                    rgba(8, 17, 31, 0.92),
                    rgba(8, 17, 31, 0.55),
                    transparent
                );

            pointer-events: none;
        }

        #topBar h1 {
            margin: 0;

            font-size: clamp(
                1.2rem,
                3vw,
                2.2rem
            );

            font-weight: 900;

            text-shadow:
                0 0 12px rgba(114, 229, 255, 0.5);
        }

        #topBar p {
            margin: 2px 0 0;

            color: #b9c6da;

            font-size: 0.85rem;
        }

        /* ==================================================
           🎮 GAME AREA
           ================================================== */

        #gameStage {
            position: relative;

            z-index: 4;

            flex: 1;

            min-height: 0;

            width: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 4px 8px 12px;
        }

        #game {
            position: relative;

            display: flex;

            justify-content: center;
            align-items: center;

            width: 100%;
            height: 100%;
        }

        /* Kaplay's actual canvas */
        #game canvas {
            display: block;

            width: auto;
            height: auto;

            max-width: 100%;
            max-height: 100%;

            aspect-ratio: 800 / 450;

            image-rendering: auto;

            border-radius: 12px;

            box-shadow:
                0 0 0 2px rgba(255, 255, 255, 0.14),
                0 0 30px rgba(0, 0, 0, 0.45),
                0 20px 60px rgba(0, 0, 0, 0.45);
        }

        /* ==================================================
           📱 SMALL SCREENS
           ================================================== */

        @media (max-width: 600px) {

            #topBar {
                padding-top: 8px;
            }

            #topBar h1 {
                font-size: 1.15rem;
            }

            #topBar p {
                font-size: 0.75rem;
            }

            #gameStage {
                padding:
                    2px
                    4px
                    6px;
            }

            #game canvas {
                border-radius: 8px;
            }
        }

    </style>

</head>

<body>

    <div id="smashPage">

        <!-- ==================================================
             🌌 AMBIENT GAME-WORLD BACKGROUND
             ================================================== -->

        <canvas id="ambientCanvas"></canvas>

        <div id="ambientShade"></div>

        <!-- ==================================================
             🪿 TITLE
             ================================================== -->

        <div id="topBar">

            <h1>
                🪿 Goosey Smash World Ultimate
            </h1>

            <p>
                Version 1.0.0
            </p>

        </div>

        <!-- ==================================================
             🎮 GAME
             ================================================== -->

        <div id="gameStage">

            <div id="game"></div>

        </div>

    </div>

    <!-- ==================================================
         🎮 KAPLAY
         ================================================== -->

    <script src="https://unpkg.com/kaplay@4000.0.0-alpha.27.1/dist/kaplay.js"></script>

    <script src="game.js"></script>

    <!-- ==================================================
         🌌 COPY THE ACTUAL GAME INTO THE BACKGROUND
         ================================================== -->

    <script>

        function startAmbientMirror() {

            const gameCanvas =
                document.querySelector(
                    "#game canvas"
                );

            const ambientCanvas =
                document.getElementById(
                    "ambientCanvas"
                );

            if (
                !gameCanvas ||
                !ambientCanvas
            ) {

                requestAnimationFrame(
                    startAmbientMirror
                );

                return;
            }

            const ctx =
                ambientCanvas.getContext(
                    "2d"
                );

            function resizeAmbient() {

                const dpr =
                    window.devicePixelRatio ||
                    1;

                ambientCanvas.width =
                    window.innerWidth * dpr;

                ambientCanvas.height =
                    window.innerHeight * dpr;

                ctx.setTransform(
                    dpr,
                    0,
                    0,
                    dpr,
                    0,
                    0
                );
            }

            resizeAmbient();

            window.addEventListener(
                "resize",
                resizeAmbient
            );

            function drawAmbient() {

                ctx.clearRect(
                    0,
                    0,
                    window.innerWidth,
                    window.innerHeight
                );

                const sourceWidth =
                    gameCanvas.width;

                const sourceHeight =
                    gameCanvas.height;

                if (
                    sourceWidth > 0 &&
                    sourceHeight > 0
                ) {

                    const scale =
                        Math.max(
                            window.innerWidth /
                                sourceWidth,

                            window.innerHeight /
                                sourceHeight
                        );

                    const drawWidth =
                        sourceWidth * scale;

                    const drawHeight =
                        sourceHeight * scale;

                    const drawX =
                        (
                            window.innerWidth -
                            drawWidth
                        ) / 2;

                    const drawY =
                        (
                            window.innerHeight -
                            drawHeight
                        ) / 2;

                    ctx.drawImage(
                        gameCanvas,
                        drawX,
                        drawY,
                        drawWidth,
                        drawHeight
                    );
                }

                requestAnimationFrame(
                    drawAmbient
                );
            }

            drawAmbient();
        }

        startAmbientMirror();

    </script>

</body>

</html>
