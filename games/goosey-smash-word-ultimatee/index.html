<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Goosey Smash World Ultimate</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #08111f;
            color: white;
            font-family: system-ui, sans-serif;
        }

        /* ==================================================
           🌌 PAGE
           ================================================== */

        #smashPage {
            width: 100vw;
            height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    #18304d 0%,
                    #08111f 70%
                );

            display: flex;
            flex-direction: column;
        }

        /* ==================================================
           🪿 TITLE
           ================================================== */

        #topBar {
            flex-shrink: 0;

            text-align: center;

            padding: 10px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(8, 17, 31, 0.95),
                    rgba(8, 17, 31, 0.4)
                );

            z-index: 10;
        }

        #topBar h1 {
            margin: 0;

            font-size:
                clamp(1.2rem, 3vw, 2.2rem);

            font-weight: 900;

            text-shadow:
                0 0 15px rgba(114, 229, 255, 0.6);
        }

        #topBar p {
            margin: 2px 0 0;

            color: #b9c6da;

            font-size: 0.8rem;
        }

        /* ==================================================
           🎮 GAME
           ================================================== */

        #game {
            flex: 1;

            min-height: 0;

            width: 100%;
            height: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 5px;
        }

        #game canvas {
            display: block;

            width: min(
                100%,
                calc(100vh * 1.7777778)
            );

            height: auto;

            max-height: 100%;

            aspect-ratio: 800 / 450;

            border-radius: 12px;

            box-shadow:
                0 0 0 2px rgba(255,255,255,0.15),
                0 0 35px rgba(0,0,0,0.6);
        }

    </style>

</head>

<body>

    <div id="smashPage">

        <div id="topBar">

            <h1>
                🪿 Goosey Smash World Ultimate
            </h1>

            <p>
                Version 1.0.0
            </p>

        </div>

        <canvas id="gameCanvas"></canvas>

    </div>

    <script src="https://unpkg.com/kaplay@4000.0.0-alpha.27.1/dist/kaplay.js"></script>

    <script src="game.js"></script>

</body>

</html>
