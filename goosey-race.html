<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Goosey Race</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(
                circle at top,
                #193d2b 0%,
                #07140d 55%,
                #030805 100%
            );
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .game {
        width: min(1000px, 94%);
        padding: 35px;
        border: 3px solid #d4af37;
        border-radius: 25px;
        background: rgba(5, 20, 12, .94);
        box-shadow:
            0 0 30px rgba(212, 175, 55, .25),
            inset 0 0 30px rgba(0, 0, 0, .5);
        text-align: center;
    }

    h1 {
        margin: 0;
        font-size: 52px;
        color: #d4af37;
        text-shadow:
            0 0 15px rgba(212, 175, 55, .45);
    }

    .subtitle {
        margin-top: 8px;
        color: #b8c8bd;
        font-size: 18px;
        margin-bottom: 30px;
    }

    .track {
        position: relative;
        height: 300px;
        overflow: hidden;
        border-radius: 18px;
        background:
            linear-gradient(
                #10291b 0%,
                #0b2015 70%,
                #183b27 70%,
                #183b27 100%
            );
        border: 2px solid #356f4b;
        box-shadow:
            inset 0 0 25px rgba(0,0,0,.5);
    }

    .lane {
        position: absolute;
        left: 0;
        right: 0;
        height: 100px;
        border-bottom: 2px dashed rgba(212,175,55,.25);
    }

    .finish {
        position: absolute;
        right: 45px;
        top: 0;
        bottom: 0;
        width: 12px;

        background:
            repeating-linear-gradient(
                to bottom,
                #d4af37 0 15px,
                #111 15px 30px
            );

        box-shadow: 0 0 12px rgba(212,175,55,.35);
    }

    .goose {
        position: absolute;
        left: 10px;
        font-size: 48px;
        transition: left .08s linear;
        filter: drop-shadow(0 3px 3px rgba(0,0,0,.45));
    }

    #goose1 {
        top: 18px;
    }

    #goose2 {
        top: 118px;
    }

    #goose3 {
        top: 218px;
    }

    .goose.running {
        animation: run 0.16s infinite alternate;
    }

    @keyframes run {
        from {
            transform: translateY(0) rotate(-3deg);
        }

        to {
            transform: translateY(-5px) rotate(3deg);
        }
    }

    button {
        border: none;
        border-radius: 14px;
        padding: 18px 25px;
        margin-top: 20px;
        font-size: 19px;
        font-weight: bold;
        cursor: pointer;
        transition: .15s;
    }

    button:hover {
        transform: translateY(-3px);
        filter: brightness(1.15);
    }

    button:active {
        transform: translateY(1px);
    }

    #startButton {
        background: #d4af37;
        color: #111;
        font-size: 24px;
    }

    #status {
        min-height: 50px;
        margin-top: 20px;
        padding: 12px;
        border-radius: 10px;
        background: rgba(255,255,255,.05);
        color: #dce9df;
        font-size: 20px;
        font-weight: bold;
    }

    .back {
        background: #222;
        color: white;
        border: 1px solid #555;
        font-size: 16px;
    }
</style>
</head>

<body>

<div class="game">

    <h1>🏁 GOOSEY RACE</h1>

    <div class="subtitle">
        RUN, GOOSEY, RUN!!!
    </div>

    <div class="track" id="track">

        <div class="lane" style="top: 0;"></div>
        <div class="lane" style="top: 90px;"></div>

        <div class="finish"></div>

        <div class="goose" id="goose1">🪿</div>
        <div class="goose" id="goose2">🪿</div>
        <div class="goose" id="goose3">🪿</div>

    </div>

    <button
        id="startButton"
        onclick="startRace()"
    >
        🏁 START RACE
    </button>

    <div id="status">
        Ready?
    </div>

    <button
        class="back"
        onclick="window.location.href='index.html'"
    >
        ← BACK TO GOOSEYWORKS
    </button>

</div>

<script src="goosey-race.js"></script>

</body>
</html>
