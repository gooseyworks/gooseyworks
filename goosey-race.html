<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Goosey Race</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #6fc5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game {
            width: min(1000px, 95%);
            background: white;
            border: 4px solid #222;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,.25);
        }

        h1 {
            margin: 0;
            font-size: 48px;
        }

        .subtitle {
            margin: 10px 0 25px;
            color: #555;
        }

        .track {
            position: relative;
            height: 300px;
            overflow: hidden;
            border: 4px solid #333;
            border-radius: 18px;
            background: #8fd36a;
        }

        .finish {
            position: absolute;
            right: 45px;
            top: 0;
            bottom: 0;
            width: 12px;
            background: repeating-linear-gradient(
                to bottom,
                white 0 15px,
                black 15px 30px
            );
        }

        .lane {
            position: absolute;
            left: 0;
            right: 0;
            height: 90px;
            border-bottom: 3px dashed rgba(255,255,255,.8);
        }

        .goose {
            position: absolute;
            left: 10px;
            font-size: 50px;
            transition: left .08s linear;
        }

        #goose1 {
            top: 15px;
        }

        #goose2 {
            top: 105px;
        }

        #goose3 {
            top: 195px;
        }

        button {
            margin-top: 20px;
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            background: #222;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        #status {
            margin-top: 20px;
            min-height: 50px;
            font-size: 22px;
            font-weight: bold;
        }

        .back {
            background: #666;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>🏁 GOOSEY RACE</h1>

    <div class="subtitle">
        RUN, GOOSEY, RUN!!!
    </div>

    <div class="track">

        <div class="lane" style="top: 0;"></div>
        <div class="lane" style="top: 90px;"></div>

        <div class="finish"></div>

        <div class="goose" id="goose1">🪿</div>
        <div class="goose" id="goose2">🪿</div>
        <div class="goose" id="goose3">🪿</div>

    </div>

    <button
        id="startButton"
        onclick="startRace()"
    >
        🏁 START RACE
    </button>

    <div id="status">
        Ready?
    </div>

    <button
        class="back"
        onclick="window.location.href='index.html'"
    >
        ← BACK TO GOOSEYWORKS
    </button>

</div>

<script src="goosey-race.js"></script>

</body>
</html>
