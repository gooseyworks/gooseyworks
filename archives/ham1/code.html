<main>
    <a href="index.html">← Back to Ham 1 Archive</a>

    <h1>🐢 Turtle Life 1 — Python Code</h1>

    <p class="muted">
        The original source code for Turtle Life 1, part of the
        GooseyWorks Archives.
    </p>

    <div class="buttons">
        <button id="copyButton" type="button">📋 Copy Code</button>

        <a class="button" href="Turtle_Life_1.py" download>
            📥 Download Python File

        <a class="button secondary" href="index.html">

    <p id="status" class="muted">Loading Python source code...</p>

    <div class="code-panel">
        <div class="code-heading">Turtle_Life_1.py</div>
        <pre><code id="source">Loading...</code></pre>
    </div>
</main>

<script>
const source = document.getElementById("source");
const statusMessage = document.getElementById("status");
const copyButton = document.getElementById("copyButton");

async function loadCode() {
    try {
        const response = await fetch("./Turtle_Life_1.py");

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const code = await response.text();
        source.textContent = code;
        statusMessage.textContent = "Source code loaded successfully!";
    } catch (error) {
        source.textContent = "The source code could not be loaded.";
        statusMessage.textContent =
            "Unable to load Turtle_Life_1.py (" + error.message + ").\n" +
            "Check that the Python file is uploaded beside code.html " +
            "in archives/ham1/ and that its capitalization matches exactly.";
    }
}

copyButton.addEventListener("click", async () => {
    const code = source.textContent;

    if (
        !code ||
        code === "Loading..." ||
        code === "The source code could not be loaded."
    ) {
        alert("The Python code has not loaded yet!");
        return;
    }

    try {
        await navigator.clipboard.writeText(code);
        alert("Turtle Life 1 code copied!");
    } catch (error) {
        alert("Automatic copying failed. You can select the displayed code and copy it manually.");
    }
});

loadCode();
</script>
</body>
