 <!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Goosey Smash World Ultimate</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(
                    circle at center,
                    #203d5c,
                    #08111f
                );

            color: white;

            font-family:
                system-ui,
                sans-serif;
        }

        /* ==================================================
           🪿 TITLE
           ================================================== */

        h1 {
            position: fixed;

            top: 8px;
            left: 0;

            width: 100%;

            margin: 0;

            text-align: center;

            z-index: 20;

            font-size:
                clamp(1.2rem, 3vw, 2rem);

            font-weight: 900;

            text-shadow:
                0 0 15px rgba(
                    114,
                    229,
                    255,
                    0.65
                );

            pointer-events: none;
        }

        p {
            position: fixed;

            top: 52px;
            left: 0;

            width: 100%;

            margin: 0;

            text-align: center;

            z-index: 20;

            color: #b9c6da;

            font-size: 0.8rem;

            pointer-events: none;
        }

        /* ==================================================
           🎮 KAPLAY CONTAINER
           ================================================== */

        #game {
            width: 100%;
            height: 100%;
        }

        /* ==================================================
           🎮 ACTUAL KAPLAY CANVAS
           ================================================== */

        body > canvas {
            position: fixed;

            left: 50%;
            top: 53%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            width:
                min(
                    98vw,
                    calc(91vh * 1.7777778)
                );

            height: auto;

            aspect-ratio: 800 / 450;

            display: block;

            z-index: 10;

            border-radius: 14px;

            box-shadow:
                0 0 0 2px
                    rgba(
                        255,
                        255,
                        255,
                        0.18
                    ),

                0 0 30px
                    rgba(
                        0,
                        0,
                        0,
                        0.55
                    ),

                0 20px 60px
                    rgba(
                        0,
                        0,
                        0,
                        0.45
                    );
        }
/* ==================================================
   🌌 GOOSEY SMASH AMBIENT BACKGROUND
   ================================================== */

#gameBackground {
    position: fixed;
    inset: 0;

    z-index: 0;

    background:
        radial-gradient(
            circle at 50% 45%,
            #274d72 0%,
            #10283f 45%,
            #08111f 100%
        );

    overflow: hidden;

    transition:
        background 0.8s ease,
        filter 0.8s ease;
}

/* Animated glow blobs */
#gameBackground::before,
#gameBackground::after {
    content: "";

    position: absolute;

    width: 45vw;
    height: 45vw;

    border-radius: 50%;

    filter: blur(70px);

    opacity: 0.45;

    animation:
        gooseyFloat 7s ease-in-out infinite;
}

#gameBackground::before {
    left: -10vw;
    top: 20vh;

    background: #3478b8;
}

#gameBackground::after {
    right: -10vw;
    bottom: 10vh;

    background: #7547b8;

    animation-delay: -3.5s;
}

@keyframes gooseyFloat {

    0%, 100% {
        transform:
            translate(
                0,
                0
            )
            scale(1);
    }

    50% {
        transform:
            translate(
                5vw,
                -4vh
            )
            scale(1.15);
    }
}

/* ==================================================
   🎮 KEEP GAME ABOVE BACKGROUND
   ================================================== */

#game {
    position: relative;
    z-index: 10;

    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* Kaplay canvas */
canvas {
    position: relative;

    z-index: 10;

    display: block;

    width:
        min(
            96vw,
            calc(82vh * 1.7777778)
        );

    height: auto;

    aspect-ratio: 800 / 450;

    border-radius: 14px;

    box-shadow:
        0 0 0 2px
            rgba(
                255,
                255,
                255,
                0.15
            ),

        0 0 35px
            rgba(
                0,
                0,
                0,
                0.55
            );
}
    </style>

</head>

<body>

    <h1>
        🪿 Goosey Smash World Ultimate
    </h1>

    <p>
        Version 1.0.0
    </p>

    <div id="game"></div>
<div id="gameBackground"></div>
    <script src="https://unpkg.com/kaplay@4000.0.0-alpha.27.1/dist/kaplay.js"></script>

    <script src="main.js"></script>

</body>

</html>
