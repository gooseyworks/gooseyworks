<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Goosey Smash World Ultimate</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #08111f;
        }

        /* ==================================================
           🌌 FULL PAGE
           ================================================== */

        #smashPage {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            background: #08111f;
        }

        /* ==================================================
           🌌 LIVE GAME BACKGROUND
           ================================================== */

        #ambientCanvas {
            position: fixed;
            inset: -10%;

            width: 120vw;
            height: 120vh;

            z-index: 0;

            opacity: 0.55;

            filter:
                blur(35px)
                saturate(1.4);

            pointer-events: none;
        }

        #ambientShade {
            position: fixed;
            inset: 0;

            z-index: 1;

            background:
                radial-gradient(
                    circle,
                    rgba(8, 17, 31, 0.05),
                    rgba(8, 17, 31, 0.7)
                );

            pointer-events: none;
        }

        /* ==================================================
           🪿 TITLE
           ================================================== */

        #topBar {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            padding: 10px;

            text-align: center;

            z-index: 20;

            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    rgba(8,17,31,0.95),
                    rgba(8,17,31,0.35),
                    transparent
                );
        }

        #topBar h1 {
            margin: 0;

            font-size:
                clamp(1.2rem, 3vw, 2rem);

            font-weight: 900;

            text-shadow:
                0 0 15px rgba(114,229,255,0.5);
        }

        #topBar p {
            margin: 2px 0 0;

            color: #b9c6da;

            font-size: 0.8rem;
        }

        /* ==================================================
           🎮 KAPLAY GAME CANVAS
           ================================================== */

        /*
           Kaplay creates the canvas itself.
           It is NOT necessarily inside #game.

           So target the actual canvas directly.
        */

        body > canvas {
            position: fixed !important;

            left: 50% !important;
            top: 52% !important;

            transform:
                translate(-50%, -50%) !important;

            width: min(
                96vw,
                calc(92vh * 1.7777778)
            ) !important;

            height: auto !important;

            aspect-ratio: 800 / 450 !important;

            z-index: 10 !important;

            display: block !important;

            border-radius: 12px;

            box-shadow:
                0 0 0 2px rgba(255,255,255,0.15),
                0 0 35px rgba(0,0,0,0.6),
                0 20px 70px rgba(0,0,0,0.5);
        }

        /* Hide the unused container */
        #game {
            display: none;
        }

    </style>

</head>

<body>

    <div id="smashPage">

        <canvas id="ambientCanvas"></canvas>

        <div id="ambientShade"></div>

        <div id="topBar">

            <h1>
                🪿 Goosey Smash World Ultimate
            </h1>

            <p>
                Version 1.0.0
            </p>

        </div>

        <div id="game"></div>

    </div>

    <!-- ==================================================
         🎮 KAPLAY
         ================================================== -->

    <script src="https://unpkg.com/kaplay@4000.0.0-alpha.27.1/dist/kaplay.js"></script>

    <script src="game.js"></script>

    <!-- ==================================================
         🌌 LIVE BACKGROUND MIRROR
         ================================================== -->

    <script>

        function startAmbientMirror() {

            const gameCanvas =
                document.querySelector(
                    "body > canvas"
                );

            const ambientCanvas =
                document.getElementById(
                    "ambientCanvas"
                );

            if (
                !gameCanvas ||
                !ambientCanvas
            ) {

                requestAnimationFrame(
                    startAmbientMirror
                );

                return;
            }

            const ctx =
                ambientCanvas.getContext("2d");

            function resize() {

                const dpr =
                    window.devicePixelRatio || 1;

                ambientCanvas.width =
                    window.innerWidth * dpr;

                ambientCanvas.height =
                    window.innerHeight * dpr;

                ambientCanvas.style.width =
                    window.innerWidth + "px";

                ambientCanvas.style.height =
                    window.innerHeight + "px";

                ctx.setTransform(
                    dpr,
                    0,
                    0,
                    dpr,
                    0,
                    0
                );
            }

            resize();

            window.addEventListener(
                "resize",
                resize
            );

            function draw() {

                ctx.clearRect(
                    0,
                    0,
                    window.innerWidth,
                    window.innerHeight
                );

                const sourceWidth =
                    gameCanvas.width;

                const sourceHeight =
                    gameCanvas.height;

                if (
                    sourceWidth > 0 &&
                    sourceHeight > 0
                ) {

                    const scale =
                        Math.max(
                            window.innerWidth /
                                sourceWidth,

                            window.innerHeight /
                                sourceHeight
                        );

                    const width =
                        sourceWidth * scale;

                    const height =
                        sourceHeight * scale;

                    const x =
                        (
                            window.innerWidth -
                            width
                        ) / 2;

                    const y =
                        (
                            window.innerHeight -
                            height
                        ) / 2;

                    ctx.drawImage(
                        gameCanvas,
                        x,
                        y,
                        width,
                        height
                    );
                }

                requestAnimationFrame(draw);
            }

            draw();
        }

        startAmbientMirror();

    </script>

</body>

</html>
