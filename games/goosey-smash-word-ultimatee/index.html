<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Goosey Smash World Ultimate — Nathaniel Update v1.0.2</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #08111f;
            color: white;
            font-family: system-ui, sans-serif;
        }

        /* ==================================================
           🌌 BACKGROUND
           ================================================== */

        #gameBackground {
            position: fixed;
            inset: 0;

            z-index: 0;

            overflow: hidden;
            pointer-events: none;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #274d72 0%,
                    #10283f 45%,
                    #08111f 100%
                );

            transition:
                background 0.8s ease;
        }

        /* BIG MOVING GLOW */

        #gameBackground::before {
            content: "";

            position: absolute;

            width: 70vw;
            height: 70vw;

            left: -25vw;
            top: -15vw;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(80, 200, 255, 0.35),
                    rgba(80, 200, 255, 0)
                );

            filter: blur(25px);

            animation:
                gooseyOrb1
                6s
                ease-in-out
                infinite;
        }

        /* SECOND MOVING GLOW */

        #gameBackground::after {
            content: "";

            position: absolute;

            width: 60vw;
            height: 60vw;

            right: -20vw;
            bottom: -20vw;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(180, 80, 255, 0.30),
                    rgba(180, 80, 255, 0)
                );

            filter: blur(25px);

            animation:
                gooseyOrb2
                8s
                ease-in-out
                infinite;
        }

        @keyframes gooseyOrb1 {

            0%,
            100% {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate(25vw, 18vh)
                    scale(1.25);
            }
        }

        @keyframes gooseyOrb2 {

            0%,
            100% {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate(-20vw, -15vh)
                    scale(1.3);
            }
        }

        /* ==================================================
           ✨ FLOATING LIGHTS
           ================================================== */

        .goosey-particle {
            position: absolute;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.65
                );

            box-shadow:
                0 0 12px
                rgba(
                    255,
                    255,
                    255,
                    0.8
                );

            animation:
                gooseyParticleFloat
                var(--particle-speed)
                ease-in-out
                infinite;
        }

        @keyframes gooseyParticleFloat {

            0%,
            100% {
                transform:
                    translateY(0)
                    scale(1);

                opacity: 0.25;
            }

            50% {
                transform:
                    translateY(-70px)
                    scale(1.8);

                opacity: 0.9;
            }
        }

        /* ==================================================
           🪿 TITLE
           ================================================== */

        #topBar {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            padding: 10px;

            text-align: center;

            z-index: 20;

            background:
                linear-gradient(
                    to bottom,
                    rgba(
                        8,
                        17,
                        31,
                        0.95
                    ),
                    rgba(
                        8,
                        17,
                        31,
                        0.35
                    )
                );

            pointer-events: none;
        }

        #topBar h1 {
            margin: 0;

            font-size:
                clamp(
                    1.2rem,
                    3vw,
                    2.2rem
                );

            font-weight: 900;

            text-shadow:
                0 0 15px
                rgba(
                    114,
                    229,
                    255,
                    0.65
                );
        }

        #topBar p {
            margin: 2px 0 0;

            color: #b9c6da;

            font-size: 0.8rem;
        }

        /* ==================================================
           🎮 GAME
           ================================================== */

        #game {
            position: relative;

            width: 100%;
            height: 100%;

            z-index: 10;

            display: flex;

            justify-content: center;
            align-items: center;
        }

        /* ==================================================
           🎮 KAPLAY CANVAS
           ================================================== */

        canvas {
            position: fixed;

            left: 50%;
            top: 54%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            width:
                min(
                    96vw,
                    calc(
                        88vh *
                        1.7777778
                    )
                );

            height: auto;

            aspect-ratio:
                800 / 450;

            display: block;

            z-index: 10;

            border-radius: 14px;

            box-shadow:

                0 0 0 2px
                rgba(
                    255,
                    255,
                    255,
                    0.18
                ),

                0 0 35px
                rgba(
                    0,
                    0,
                    0,
                    0.6
                ),

                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.45
                );
        }

    </style>

</head>

<body>

    <!-- ==================================================
         🌌 BACKGROUND
         ================================================== -->

    <div id="gameBackground"></div>

    <!-- ==================================================
         🪿 TITLE
         ================================================== -->

    <div id="topBar">

        <h1>
            🪿 Goosey Smash World Ultimate
        </h1>

        <p>
            Version 1.0.2 — Nathaniel Update
        </p>

    </div>

    <!-- ==================================================
         🎮 GAME
         ================================================== -->

    <div id="game"></div>

    <script src="https://unpkg.com/kaplay@4000.0.0-alpha.27.1/dist/kaplay.js"></script>

    <script src="main.js"></script>

    <!-- ==================================================
         🌌 DYNAMIC GAME BACKGROUND
         ================================================== -->

    <script>

        const gameBackground =
            document.getElementById(
                "gameBackground"
            );

        function updateGooseyBackground() {

            if (!gameBackground) {
                return;
            }

            /* ==========================================
               🎮 CHARACTER SELECT
               ========================================== */

            if (
                window.gooseyScene ===
                "characterSelect"
            ) {

                gameBackground.style.background =
                    `
                    radial-gradient(
                        circle at 50% 45%,
                        #274d72 0%,
                        #10283f 45%,
                        #08111f 100%
                    )
                    `;

            }

            /* ==========================================
               ⚔️ FIGHT
               ========================================== */

            else if (
                window.gooseyScene ===
                "fight"
            ) {

                const map =
                    window.gooseyMap;

                if (map === 0) {

                    /* 🌱 GRASSLAND */

                    gameBackground.style.background =
                        `
                        radial-gradient(
                            circle at 50% 45%,
                            #4fa84f 0%,
                            #214f30 45%,
                            #08111f 100%
                        )
                        `;

                } else if (map === 1) {

                    /* 🏃 PARKOUR */

                    gameBackground.style.background =
                        `
                        radial-gradient(
                            circle at 50% 45%,
                            #26794c 0%,
                            #123d2d 45%,
                            #08111f 100%
                        )
                        `;

                } else if (map === 2) {

                    /* 💀 NIGHTMARE */

                    gameBackground.style.background =
                        `
                        radial-gradient(
                            circle at 50% 45%,
                            #4c294f 0%,
                            #211329 45%,
                            #05050b 100%
                        )
                        `;

                } else if (map === 3) {

                    /* 🌀 GRAVITY CHAOS */

                    gameBackground.style.background =
                        `
                        radial-gradient(
                            circle at 50% 45%,
                            #6b35a5 0%,
                            #29154d 45%,
                            #080512 100%
                        )
                        `;

                } else if (map === 4) {

                    /* 🌀🏃 PARKOUR GRAVITY */

                    gameBackground.style.background =
                        `
                        radial-gradient(
                            circle at 50% 45%,
                            #2c77aa 0%,
                            #152d50 45%,
                            #08111f 100%
                        )
                        `;

                } else if (map === 5) {

                    /* 🌋 FUTURE MAP / FALLBACK */

                    gameBackground.style.background =
                        `
                        radial-gradient(
                            circle at 50% 45%,
                            #8a3424 0%,
                            #361414 45%,
                            #090505 100%
                        )
                        `;

                }

            }

            /* ==========================================
               🏆 WIN
               ========================================== */

            else if (
                window.gooseyScene ===
                "win"
            ) {

                gameBackground.style.background =
                    `
                    radial-gradient(
                        circle at 50% 45%,
                        #a67c20 0%,
                        #4f3510 45%,
                        #120e05 100%
                    )
                    `;

            }

            /* ==========================================
               🏠 DEFAULT / TITLE
               ========================================== */

            else {

                gameBackground.style.background =
                    `
                    radial-gradient(
                        circle at 50% 45%,
                        #18304d 0%,
                        #08111f 70%
                    )
                    `;
            }
        }

        /* ==================================================
           ✨ CREATE FLOATING BACKGROUND PARTICLES
           ================================================== */

        function createBackgroundParticles() {

            for (
                let i = 0;
                i < 18;
                i++
            ) {

                const particle =
                    document.createElement(
                        "div"
                    );

                particle.className =
                    "goosey-particle";

                particle.style.left =
                    Math.random() * 100 +
                    "%";

                particle.style.top =
                    Math.random() * 100 +
                    "%";

                particle.style.setProperty(
                    "--particle-speed",
                    (3 + Math.random() * 5) +
                    "s"
                );

                gameBackground.appendChild(
                    particle
                );
            }
        }

        createBackgroundParticles();

        setInterval(
            updateGooseyBackground,
            100
        );

        updateGooseyBackground();

    </script>

</body>

</html>
